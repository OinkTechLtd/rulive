name: Search for Streams

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run scanner
        run: python scanner.py
      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add data/found_streams.json
          git commit -m "Auto-update found streams" || exit 0
          git push